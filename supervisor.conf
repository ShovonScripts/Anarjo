; Supervisor configuration for Anarjo Queue Worker
; Copy to /etc/supervisor/conf.d/anarjo-worker.conf on the production server.
; IMPORTANT: Adjust the paths below to match your deployment before copying.
; Then run:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start anarjo-worker:*

[program:anarjo-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/anarjo/artisan queue:work --queue=default --sleep=3 --tries=3 --delay=5 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/anarjo/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
